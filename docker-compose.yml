services:
  # 前端应用（HTTPS 版本）
  interview-web:
    image: interview-web:latest
    container_name: interview-web
    restart: unless-stopped
    ports:
      - "443:8443"   # HTTPS 端口（443 是 HTTPS 默认端口，访问时无需输入端口号）
    volumes:
      # 挂载 SSL 证书
      - ./ssl:/etc/nginx/ssl:ro
      # 挂载 HTTPS nginx 配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  interview-net:
    external: true

